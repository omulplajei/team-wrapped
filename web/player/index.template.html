<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="assets/player.css">
  <!--TW_THEME-->
</head>
<body>
  <div id="tw-backdrop"></div>
  <div id="tw-stage"></div>

  <div id="tw-start" class="tw-overlay">
    <!--TW_LOGO-->
    <h1 id="tw-start-title">{{TITLE}}</h1>
    <button id="tw-play-btn" type="button" aria-label="Play" title="Play"><svg class="tw-icon tw-icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z"/></svg></button>
  </div>

  <div id="tw-end" class="tw-overlay" hidden>
    <!--TW_LOGO-->
    <button id="tw-replay-btn" type="button" aria-label="Replay" title="Replay"><svg class="tw-icon tw-icon-replay" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
  </div>

  <div id="tw-controls">
    <button id="tw-toggle" type="button" data-state="paused" aria-label="Play" title="Play"><svg class="tw-icon tw-icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z"/></svg><svg class="tw-icon tw-icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
    <div id="tw-progress"></div>
    <button id="tw-mute" type="button" data-state="on" aria-label="Mute" title="Mute"><svg class="tw-icon tw-icon-sound" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M15 9.5a4 4 0 0 1 0 5M17.5 7a7.5 7.5 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="tw-icon tw-icon-muted" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/timing.js"></script>
  <script src="assets/presets.js"></script>
  <!--TW_DATA-->
  <!--TW_RENDERERS-->
  <script src="assets/player.js"></script>
</body>
</html>
