id: capability-commits
title: The whole year in a postcard
type: capability-flow
# One hexagon per capability (a configured group); every commit of the year falls into it as a block whose
# area grows with the lines it changed. commit_flow only exists for scope `all`: give the script entry `scope: all`.
requires:
  - dataset: commit_flow.groups
    fields: [name, commits]
    allow_partial: true      # unenriched commits count as 0 lines (smallest blocks); a "partial data" note is shown
  - dataset: commit_flow.window
    fields: [days, start]
    allow_partial: true
params:
  heading: "The whole year in a postcard"
  note: "Each box is a commit. The bigger the box, the bigger the change (lines of code)."
  groups: commit_flow.groups
  window: commit_flow.window
  # Optional: place the hexagons by hand instead of the automatic honeycomb (core in the middle).
  # Columns are whole numbers; rows may be half steps (an odd column usually sits half a row lower).
  # Used only when every group has a valid entry and no two hexagons overlap.
  # layout:
  #   - {group: alpha, col: 1, row: 0.5}
  #   - {group: beta, col: 1, row: 1.5}
  #   - {group: gamma, col: 0, row: 0}
  #   - {group: delta, col: 2, row: 0}
  #   - {group: epsilon, col: 0, row: 1}
  #   - {group: zeta, col: 2, row: 1}
  #   - {group: eta, col: 1, row: 2.5}
