id: we-shipped
title: We worked hard
type: bignumber
duration: 7
requires:
  - dataset: summary.totals
    fields: [commits]
    allow_partial: false
params:
  heading: "This year, we worked hard"
  value: summary.totals.commits
  label: "Commits"
  counter: "odometer"
  # Race up fast, then land only the very last increment as a slow beat (a full second after the rest).
  count_ease: "expo.out"
  count_duration: 3.0
  count_tail: [1.0]
