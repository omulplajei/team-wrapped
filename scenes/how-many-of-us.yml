# Closing scene: the cast of the year, humans first and then the robots joining them.
id: how-many-of-us
title: How many of us
type: cast
requires:
  - dataset: contributors
    fields: [by_kind, list.kind, list.login, list.avatar_file]
    allow_partial: false
params:
  stages:
    - heading: "All done by {count:contributor|contributors}"
      kinds: [human, unlinked]
    - heading: "… and {count:robot|robots}"
      kinds: [bot]
      names: true          # each robot's name under its avatar (only bots have a `name`)
