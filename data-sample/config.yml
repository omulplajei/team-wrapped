# Sample collection config: the same layout as your private data/config.yml.
# `collect` fetches GitHub activity into data/raw (with `gh`), and `aggregate` turns it into data/derived;
# the sample has no raw records, so `derive-repos` writes data/derived/repos.json from this file instead.
org: sample-org
since: 2026-01-01
until: 2026-12-31
repos:
  - sample-analytics
  - sample-api
  - sample-auth
  - sample-billing
  - sample-cli
  - sample-design-system
  - sample-docs
  - sample-gateway
  - sample-infra
  - sample-mobile
  - sample-notifications
  - sample-sdk
  - sample-search
  - sample-web
groups:
  alpha:
    - sample-api
    - sample-auth
    - sample-billing
    - sample-docs
    - sample-gateway
    - sample-mobile
    - sample-notifications
    - sample-search
    - sample-web
  beta:
    - sample-analytics
    - sample-cli
    - sample-design-system
    - sample-infra
    - sample-sdk
  gamma: [sample-web, sample-mobile]
  delta: [sample-sdk, sample-cli]
  epsilon: [sample-docs, sample-design-system]
  zeta: [sample-infra, sample-gateway]
  eta: [sample-search]
group_info:                       # optional; label defaults to the group name, category to none (drawn neutral)
  alpha: {label: Core Alpha, category: core}
  beta: {label: Core Beta, category: core}
  gamma: {label: Extension Gamma, category: extension}
  delta: {label: Extension Delta, category: extension}
  epsilon: {label: Support Epsilon, category: support}
  zeta: {label: Support Zeta, category: support}
  eta: {label: Eta Labs}          # no category
# Optional keys (defaults shown):
# metrics: [commits, pull_requests, reviews, comments]
# commit_branches: default        # `collect` supports the default branch only; `all` is rejected for now
# timezone: UTC                   # also how `since`/`until` are read when collecting
# bot_patterns: ["*[bot]"]
# aliases: {old-login: new-login}
# curiosities: {top_n: 5}
# avatars: {download: true}
# group_info.<group>: {label: "Display name", category: core | extension | support}
